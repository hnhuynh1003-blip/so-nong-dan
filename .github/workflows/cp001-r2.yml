name: CP-001-R2 technical verification
on:
  pull_request:
    branches: ['checkpoint/cp-001-r1']
    types: [labeled]
permissions:
  contents: read
jobs:
  verification:
    if: >-
      github.repository == 'hnhuynh1003-blip/so-nong-dan' &&
      github.actor == 'hnhuynh1003-blip' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'checkpoint/cp-001-r2' &&
      (github.event.label.name == 'cp001-r2-resolve-locks' || github.event.label.name == 'cp001-r2-verify')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SND_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      SND_MODE: ${{ github.event.label.name == 'cp001-r2-resolve-locks' && 'bootstrap' || 'verify' }}
    steps:
      - name: Checkout exact candidate (not PR merge commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup exact Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.16.0'
          package-manager-cache: false
          check-latest: false
      - name: Run authorized technical gate
        run: python3 scripts/ci_r2.py "$SND_MODE"
      - name: Upload raw logs, lock candidates, screenshots, hashes (if produced)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cp001-r2-${{ env.SND_MODE }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/local-r2-*/
          retention-days: 7
          include-hidden-files: false
          if-no-files-found: error
