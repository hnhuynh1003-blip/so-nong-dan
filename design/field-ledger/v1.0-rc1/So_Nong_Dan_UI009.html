03c/small>\u003c/div>\u003clabel class=\"sr\" for=\"sheetSelect\">Phiếu cân\u003c/label>\u003cselect id=\"sheetSelect\">\u003c/select>\u003c/section>\u003csection id=\"metrics\" class=\"metrics\" aria-label=\"Tổng phiếu\">\u003c/section>\u003cdiv class=\"work\">\u003csection class=\"matrix\" aria-label=\"Bảng cân\">\u003cdiv class=\"bar\">\u003cdiv class=\"pagebuttons\">\u003cbutton data-act=\"prev-page\" aria-label=\"Trang trước\">‹\u003c/button>\u003cstrong id=\"pageLabel\">\u003c/strong>\u003cbutton data-act=\"next-page\" aria-label=\"Trang sau\">›\u003c/button>\u003c/div>\u003cdiv class=\"options\">\u003cbutton data-act=\"overview\">3 bảng/trang\u003c/button>\u003cbutton data-act=\"new-board\">＋ Bảng\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"tabs\" id=\"tabs\">\u003c/div>\u003cdiv class=\"grid\" id=\"grid\" role=\"group\" aria-label=\"25 ô cân\">\u003c/div>\u003cdiv class=\"columns\" id=\"columns\" aria-label=\"Tổng từng cột\">\u003c/div>\u003cdiv class=\"boardfoot\">\u003cspan id=\"boardCount\">\u003c/span>\u003cstrong id=\"boardGross\">\u003c/strong>\u003c/div>\u003c/section>\u003csection class=\"inputpanel\" aria-label=\"Nhập cân\">\u003cdiv class=\"entry\">\u003cdiv>\u003cdiv class=\"entrylabel\" id=\"entryLabel\">\u003c/div>\u003cdiv class=\"entryval\" id=\"entryValue\">\u003c/div>\u003c/div>\u003cdiv>\u003cdiv class=\"equiv\" id=\"entryKg\">\u003c/div>\u003cdiv class=\"small\" id=\"modeLabel\">\u003c/div>\u003c/div>\u003cbutton class=\"undo-inline\" data-act=\"undo\" aria-label=\"Hoàn tác\" title=\"Hoàn tác\">↶\u003c/button>\u003c/div>\u003cdiv class=\"keypad\" id=\"keypad\" aria-label=\"Bàn phím cân\">\u003c/div>\u003cdiv class=\"status\" id=\"status\" role=\"status\" aria-live=\"polite\">\u003c/div>\u003cdiv class=\"actions\">\u003cbutton data-act=\"deduct\">Trừ bì\u003c/button>\u003cbutton data-act=\"review\">Xem phiếu ›\u003c/button>\u003c/div>\u003csection class=\"financial\" id=\"financial\">\u003c/section>\u003c/section>\u003c/div>\u003cp class=\"footnote\">Bản thiết kế · Không lưu dữ liệu thật · D10: chưa xác minh app cũ.\u003c/p>\u003c/main>\u003c/div>\u003cdialog id=\"modal\" aria-labelledby=\"dtitle\">\u003cdiv class=\"dialogtitle\">\u003ch2 id=\"dtitle\">\u003c/h2>\u003cbutton data-act=\"close\" aria-label=\"Đóng\">✕\u003c/button>\u003c/div>\u003cdiv id=\"dbody\" class=\"dbody\">\u003c/div>\u003c/dialog>\u003cscript>\n'use strict';\nconst $=s=>document.querySelector(s), A=n=>Array.from({length:n},()=>null), nums=[443,446,439,451,444,438,452,447,441,449,445,450,437,442,448,451,444,446,440,447,452,438,445,441,449], ordinal=i=>(i%5)*5+Math.floor(i/5), batch=(n,shift=0)=>A(25).map((_,i)=>ordinal(i)\u003cn?String(nums[(ordinal(i)+shift)%25]):null);\nconst sheets=[{id:'01',boards:[batch(25),batch(25,8),batch(13,17)],price:'7350',tare:{type:'ratio',g:'1000',bags:'10'}},{id:'02',boards:[batch(10,3)],price:'7200',tare:{type:'unknown'}}];\nlet si=0,bi=2,ci=17,buffer='',order='col',auto=true,msg='Nháp trong phiên',err=false,opener=null;const undo=[];const modal=$('#modal');\nconst sheet=()=>sheets[si], board=()=>sheet().boards[bi], count=a=>a.filter(x=>x!==null).length, sum=a=>a.reduce((s,x)=>s+(x===null?0n:BigInt(x)*100n),0n), sc=s=>s.boards.reduce((n,b)=>n+count(b),0), sg=s=>s.boards.reduce((n,b)=>n+sum(b),0n), gc=()=>sheets.reduce((n,s)=>n+sc(s),0), gg=()=>sheets.reduce((n,s)=>n+sg(s),0n);const nf=n=>n.toLocaleString('vi-VN');\nfunction kg(g,unit=true){let neg=g\u003c0n;if(neg)g=-g;let f=String(g%1000n).padStart(3,'0').replace(/0+$/,'');return (neg?'−':'')+nf(g/1000n)+(f?','+f:',0')+(unit?' kg':'')}\nfunction rational(n,d,unit='kg'){if(n%d===0n)return unit==='kg'?kg(n/d):nf(n/d)+' đ';return unit==='kg'?nf(n)+'/'+nf(d)+' g':nf(n)+'/'+nf(d)+' đ'}\nfunction money(v){return v===null?'—':nf(BigInt(v))+' đ'}\nfunction value(n){return n===null?'—':kg(BigInt(n)*100n,false)}\nfunction totals(s){const n=sc(s),g=sg(s);const missing={g:n?g:null,t:null,p:null,settle:null,amount:null};if(!n||s.tare.type!=='ratio')return missing;const tn=BigInt(s.tare.g)*BigInt(n),td=BigInt(s.tare.bags);if(tn\u003c=0n||td\u003c=0n||tn>g*td)return missing;const pn=g*td-tn,q=td*1000n;const settle=pn/q+(2n*(pn%q)>=q?1n:0n);return {g,t:[tn,td],p:[pn,td],settle,amount:s.price===null?null:settle*BigInt(s.price)}}\n// Independent UI fixture preview only. Production must use reviewed CP-002 engine and approved policy.\nfunction previewAmount(t){return t.amount===null?'—':money(t.amount)}\nfunction previewSettlement(t){return t.settle===null?'—':nf(t.settle)+' kg'}\nfunction groupPreview(){const a=sheets.map(totals);return a.every(t=>t.amount!==null)?money(a.reduce((n,t)=>n+t.amount,0n)):'—'}\nfunction rstr(v,unit='kg'){return v===null?'—':rational(v[0],v[1],unit)}\nfunction kv(a,b){return `\u003cdiv class=\"kv\">\u003cspan>${a}\u003c/span>\u003cb>${b}\u003c/b>\u003c/div>`}\nfunction note(t,e=false){msg=t;err=e;$('#status').textContent=t;$('#status').classList.toggle('error',e)}\nfunction snapshot(){undo.push({si,bi,ci,sheets:structuredClone(sheets)});if(undo.length>100)undo.shift()}\nfunction sequence(){return Array.from({length:25},(_,i)=>(i%5)*5+Math.floor(i/5))}\nfunction first(b){return sequence().find(i=>b[i]===null)??0}\nfunction change(fn){if(buffer){note('Ghi hoặc xóa số đang nhập trước.',true);return false}fn();return true}\nfunction selectSheet(i){change(()=>{si=i;bi=0;ci=first(board());msg='Nháp trong phiên';err=false;render()})}\nfunction selectBoard(i){change(()=>{if(!sheet().boards[i])return;bi=i;ci=first(board());render()})}\nfunction advance(){let seq=sequence(),j=seq.indexOf(ci),next=seq.slice(j+1).find(i=>board()[i]===null);if(next!==undefined){ci=next;return}next=seq.find(i=>board()[i]===null);if(next!==undefined){ci=next;return}let nb=sheet().boards.findIndex((b,i)=>i>bi&&count(b)\u003c25);if(nb\u003c0)nb=sheet().boards.findIndex(b=>count(b)\u003c25);if(nb\u003c0){sheet().boards.push(A(25));nb=sheet().boards.length-1}bi=nb;ci=first(board())}\nfunction commit(){if(!/^\\d{3}$/.test(buffer)||BigInt(buffer)\u003c=0n){note('Cần 3 chữ số, lớn hơn 0.',true);return}snapshot();const old=board()[ci],raw=buffer;board()[ci]=raw;buffer='';advance();msg=(old===null?'Đã ghi ':'Đã sửa ')+kg(BigInt(raw)*100n)+' · trong phiên';err=false;render()}\nfunction key(k){if(/^\\d$/.test(k)){if(buffer.length>=3){note('Ghi hoặc xóa số đang nhập.',true);return}buffer+=k;if(buffer.length===3&&auto&&board()[ci]===null&&BigInt(buffer)>0n){commit();return}msg=buffer.length===3&&BigInt(buffer)===0n?'Khối lượng phải lớn hơn 0.':'';err=buffer==='000';renderEntry();return}if(k==='back'){buffer=buffer.slice(0,-1);msg='';err=false;renderEntry();return}if(k==='clear'){buffer='';msg='';err=false;renderEntry();return}if(k==='commit'){commit();return}if(k==='skip'){change(()=>{let seq=sequence();ci=seq[(seq.indexOf(ci)+1)%25];render()});return}}\nfunction renderEntry(){const old=board()[ci];$('#entryLabel').textContent=`Bao ${bi*25+ordinal(ci)+1}${old!==null?' · Sửa '+value(old)+' kg':''}`;$('#entryValue').textContent=buffer?buffer.padEnd(3,'–'):'– – –';$('#entryKg').textContent=buffer.length===3?kg(BigInt(buffer)*100n):'— kg';$('#modeLabel').textContent='Theo cột'+' · '+(auto?'Tự ghi':'Thủ công');$('#commit').textContent=old!==null?'Ghi sửa':'Ghi bao';$('#commit').disabled=buffer.length!==3||BigInt(buffer||0)\u003c=0n;note(msg,err)}\nfunction render(){const active=document.activeElement,focus=active?.dataset.cell!==undefined?'cell':active?.dataset.board!==undefined?'board':null;$('#sheetSelect').innerHTML=sheets.map((s,i)=>`\u003coption value=\"${i}\">Phiếu ${s.id}\u003c/option>`).join('');$('#sheetSelect').value=String(si);$('#railSheets').innerHTML=sheets.map((s,i)=>`\u003cbutton data-sheet=\"${i}\" aria-current=\"${i===si}\">Phiếu ${s.id}\u003csmall>${sc(s)} bao · ${sc(s)?kg(sg(s)):'—'}\u003c/small>\u003c/button>`).join('');$('#metrics').innerHTML=`\u003cdiv class=\"metric\">\u003cspan>Số bao · phiếu\u003c/span>\u003cstrong>${sc(sheet())}\u003c/strong>\u003c/div>\u003cdiv class=\"metric\">\u003cspan>Gộp · phiếu (kg)\u003c/span>\u003cstrong>${sc(sheet())?kg(sg(sheet()),false):'—'}\u003c/strong>\u003c/div>\u003cdiv class=\"metric\">\u003cspan>Gộp · bảng (kg)\u003c/span>\u003cstrong>${count(board())?kg(sum(board()),false):'—'}\u003c/strong>\u003c/div>`;let pg=Math.floor(bi/3),np=Math.ceil(sheet().boards.length/3);$('#pageLabel').textContent=`Trang ${pg+1}/${np}`;$('[data-act=prev-page]').disabled=pg===0;$('[data-act=next-page]').disabled=pg>=np-1;$('#tabs').innerHTML=Array.from({length:3},(_,j)=>{let i=pg*3+j,b=sheet().boards[i];return `\u003cbutton data-board=\"${i}\" aria-current=\"${i===bi}\" ${b?'':'disabled'}>Bảng ${i+1}\u003csmall>${b?count(b)+'/25 bao':'Chưa tạo'}\u003c/small>\u003c/button>`}).join('');$('#grid').innerHTML=board().map((x,i)=>`\u003cbutton class=\"cell\" data-cell=\"${i}\" aria-pressed=\"${ci===i}\" aria-label=\"Bao ${bi*25+ordinal(i)+1}, ${x===null?'chưa nhập':value(x)+' kg'}\">\u003cspan class=\"idx\">${String(bi*25+ordinal(i)+1).padStart(2,'0')}\u003c/span>\u003cspan class=\"value ${x===null?'empty':''}\">${value(x)}\u003c/span>\u003c/button>`).join('');$('#columns').innerHTML=Array.from({length:5},(_,i)=>{let a=board().filter((_,j)=>j%5===i);return `\u003cdiv>\u003csmall>Cột ${i+1}\u003c/small>\u003cb>${count(a)?kg(sum(a),false):'—'}\u003c/b>\u003c/div>`}).join('');$('#boardCount').textContent=`${count(board())}/25 bao · Cột: kg`;$('#boardGross').textContent=`Bảng ${bi+1} · ${count(board())?kg(sum(board())):'—'}`;const t=totals(sheet());$('#financial').innerHTML=`\u003cdiv class=\"head\">\u003ch2>Tạm tính · Phiếu ${sheet().id}\u003c/h2>\u003cbutton data-act=\"review\">Chi tiết ›\u003c/button>\u003c/div>${kv('Trừ bì',rstr(t.t))}${kv('Sau bì',rstr(t.p))}${kv('KL tính tiền (thử)',previewSettlement(t))}${kv('Đơn giá',sheet().price===null?'—':money(sheet().price)+'/kg')}${kv('Tiền tính thử',previewAmount(t))}\u003cp class=\"priceend\">${sc(sheet())&&sheet().tare.type==='ratio'&&t.t===null?'Bì vượt gộp · kiểm tra lại.':'Mẫu 003crect x=\"3\" y=\"5\" width=\"18\" height=\"15\" rx=\"2\"/>\u003cpath d=\"M21 10h-6a3 3 0 0 0 0 6h6M15 13h1\"/>',data:'\u003crect x=\"3\" y=\"3\" width=\"18\" height=\"5\" rx=\"1\"/>\u003cpath d=\"M5 8v13h14V8M9 12h6\"/>',plus:'\u003cpath d=\"M12 5v14M5 12h14\"/>',scale:'\u003cpath d=\"M12 3v17M6 21h12M4 7h16M7 7 3 15h8L7 7ZM17 7l-4 8h8l-4-8Z\"/>',fish:'\u003cpath d=\"M3 12c5-7 11-7 16 0-5 7-11 7-16 0ZM19 12l3-4v8l-3-4ZM8 11h.1\"/>',cost:'\u003crect x=\"4\" y=\"3\" width=\"16\" height=\"18\" rx=\"2\"/>\u003cpath d=\"M8 8h8M8 12h8M8 16h5\"/>',alert:'\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 7v6m0 4h.01\"/>'};const ico=n=>`\u003csvg aria-hidden=\"true\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\">${icons[n]}\u003c/svg>`;\nconst records=parent.UI008Fixtures.records;\n// All source links below refer only to the synthetic fixtures. Payment dates/accounts are NEW independent sample observations, not derived from production records.\nconst payments=parent.UI008Fixtures.payments;\nconst accounts=parent.UI008Fixtures.accounts;\nconst assets=parent.UI008Fixtures.assets;\nconst navs=[['home','home','Trang chủ'],['farm','farm','Sản xuất'],['quick','plus','Ghi nhanh'],['finance','wallet','Tài chính'],['data','data','Dữ liệu']];const tabs=[['cashflow','Thu chi'],['debt','Công nợ'],['accounts','Tài khoản'],['loans','Khoản vay'],['assets','Tài sản']];\nlet sourceReturn=null;let year='2026',tab='cashflow',selected='p8',query='',filter='all',listState='default',opener=null,activeForm=null,activeContext=null;const drafts={};const modal=$('#dialog');\nconst nav=()=>navs.map(([id,i,n])=>`\u003cbutton data-nav=\"${id}\" class=\"${id==='quick'?'quick':''}\" ${id==='finance'?'aria-current=\"page\"':''}>${ico(i)}${n}\u003c/button>`).join('');$('#nav').innerHTML=nav();$('#bottom').innerHTML=nav();$('#brand').innerHTML=`\u003cspan class=\"mark\">${ico('leaf')}\u003c/span>Sổ Nông Dân`;$('#mobilebrand').innerHTML=`\u003cspan class=\"mark\">${ico('leaf')}\u003c/span>Sổ Nông Dân`;\nconst kv=(a,b)=>`\u003cdiv class=\"kv\">\u003cspan>${a}\u003c/span>\u003cb>${b}\u003c/b>\u003c/div>`;const known=()=>year==='2026';const sum=a=>a.reduce((n,x)=>n+BigInt(x.amount),0n);const accountName=id=>accounts.find(x=>x.id===id)?.title||'Chưa biết';const signed=(n)=>n===null?'—':(n>0n?'+':n\u003c0n?'−':'')+money(n\u003c0n?-n:n);const linked=r=>payments.filter(p=>p.link===r.id);const paid=r=>r.quality==='Đã xác nhận'?sum(linked(r)):null;const outstanding=r=>paid(r)===null?null:BigInt(r.amount)-paid(r);const debtRecords=()=>records.filter(r=>outstanding(r)===null||outstanding(r)>0n);const groupTotals=()=>({in:sum(payments.filter(x=>x.kind==='in')),out:sum(payments.filter(x=>x.kind==='out'))});const accountDelta=id=>payments.reduce((n,x)=>n+(x.kind==='transfer'?(x.to===id?BigInt(x.amount):x.account===id?-BigInt(x.amount):0n):x.account===id?(x.kind==='in'?1n:-1n)*BigInt(x.amount):0n),0n);const recordedBalance=a=>BigInt(a.opening)+accountDelta(a.id);const loanPrincipal=()=>sum(payments.filter(p=>p.cat==='Vay gốc'))-sum(payments.filter(p=>p.cat==='Trả gốc'));\nconst options=(arr)=>arr.map(([v,n])=>`\u003coption value=\"${esc(v)}\">${esc(n)}\u003c/option>`).join('');\nconst summary=(pairs,extra='',warning=known()?'Đến 27/11/2026 · độ phủ một phần':'Chưa có dữ liệu mẫu · độ phủ chưa biết')=>`\u003cdiv class=\"summary\">${pairs.map(([n,v])=>`\u003cdiv class=\"metric\">\u003cspan>${n}\u003c/span>\u003cb>${v}\u003c/b>\u003c/div>`).join('')}${extra?`\u003cdiv class=\"balance-line\">${extra}\u003c/div>`:''}\u003cdiv class=\"warning\">${ico('alert')}${known()?warning:'Chưa có dữ liệu mẫu · độ phủ chưa biết'}\u003c/div>\u003c/div>`;\nconst button=(label,act,cls='linebtn',attrs='')=>`\u003cbutton class=\"${cls}\" data-act=\"${act}\" ${attrs}>${label}\u003c/button>`;\nfunction actionbar(){if(tab==='cashflow')return `\u003cdiv class=\"actionbar\">${button('＋ Ghi thu','receipt','solid')}${button('Ghi chi','payment')}${button('Chuyển tiền','transfer')}\u003c/div>`;if(tab==='debt')return `\u003cdiv class=\"actionbar\">${button('＋ Thu nợ','receipt','solid')}${button('Trả nợ','payment')}\u003c/div>`;if(tab==='accounts')return `\u003cdiv class=\"actionbar\">${button('＋ Đối chiếu','reconcile','solid')}${button('Chuyển tiền','transfer')}\u003c/div>`;if(tab==='loans')return `\u003cdiv class=\"actionbar\">${button('＋ Ghi khoản vay','loan','solid')}${button('Trả gốc / lãi','repay')}\u003c/div>`;return `\u003cdiv class=\"actionbar\">${button('＋ Ghi tài sản','asset','solid')}\u003c/div>`}\nconst allData=()=>!known()?[]:tab==='cashflow'?[...payments].sort((a,b)=>dateNumber(b.date)-dateNumber(a.date)):tab==='debt'?debtRecords():tab==='accounts'?accounts:tab==='loans'?[{id:'loan1',title:'Khoản vay phục vụ sản xuất',source:'Khế ước mẫu KV01'}]:assets;\nfunction dateNumber(s){return Number(s.slice(6)+s.slice(3,5)+s.slice(0,2))}\nfunction filtered(){return allData().filter(x=>{const name=x.title||x.name;const pass=!query||[name,x.source,x.cat||'',x.account?accountName(x.account):''].join(' ').toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi'));return pass&&(filter==='all'||(tab==='cashflow'&&x.kind===filter)||(tab==='debt'&&(filter==='unknown'?outstanding(x)===null:outstanding(x)!==null&&x.kind===filter)))})}\nfunction row(x){let name=x.title||x.name,date='',desc='',value='',q='',cls='';if(tab==='cashflow'){date=x.date.slice(0,5);desc=(x.kind==='transfer'?accountName(x.account)+' → '+accountName(x.to):accountName(x.account)+' · '+x.cat);value=(x.kind==='in'?'+':x.kind==='out'?'−':'')+money(x.amount);q=x.kind==='transfer'?'Nội bộ':'Đã xác nhận';cls=x.kind==='transfer'?'neutral':x.kind;}\nelse if(tab==='debt'){date=x.date;desc=x.kind==='sale'?'Bán hàng · '+x.activity:'Chi phí · '+x.activity;let v=outstanding(x);value=money(v);q=v===null?'Chưa rõ thanh toán':x.kind==='sale'?'Phải thu':'Phải trả';cls=v===null?'warn':'';}\nelse if(tab==='accounts'){desc='Số dư theo các ghi nhận mẫu';value=money(recordedBalance(x));q='Chưa đối chiếu';}\nelse if(tab==='loans'){desc='Dư gốc từ các khoản đã ghi';value=money(loanPrincipal());q='Kỳ chưa đầy đủ';}\nelse{desc=x.source;value=money(x.purchase);q=x.purchase===null?'Chưa rõ giá mua':'Giá mua theo nguồn';}\nreturn `\u003cbutton class=\"row ${['accounts','loans','assets'].includes(tab)?'account-row':''}\" data-item=\"${x.id}\" aria-pressed=\"${selected===x.id}\">${date?`\u003cspan class=\"date\">${date}\u003c/span>`:''}\u003cspan class=\"name\">${esc(name)}\u003cspan class=\"desc\">${esc(desc)}\u003c/span>\u003c/span>\u003cspan class=\"money ${cls}\">${value}\u003cspan class=\"quality ${q.includes('Chưa')?'warn':''}\">${q}\u003c/span>\u003c/span>\u003c/button>`}\nfunction topSummary(){if(tab==='cashflow'){let t=groupTotals();return summary([['Tiền vào đã ghi',money(known()?t.in:null)],['Tiền ra đã ghi',money(known()?t.out:null)]],`\u003cspan>Chênh lệch dòng tiền đã ghi\u003c/span>\u003cb>${signed(known()?t.in-t.out:null)}\u003c/b>`)}if(tab==='debt'){let d=debtRecords().filter(x=>outstanding(x)!==null);return summary([['Phải thu đã xác định',money(known()?d.filter(x=>x.kind==='sale').reduce((a,x)=>a+outstanding(x),0n):null)],['Phải trả đã xác định',money(known()?d.filter(x=>x.kind==='cost').reduce((a,x)=>a+outstanding(x),0n):null)]],known()?'\u003cspan>Chưa rõ thanh toán\u003c/span>\u003cb>2 bản ghi\u003c/b>':'','Đến 27/11/2026 · công nợ chưa đầy đủ')}\nif(tab==='accounts')return summary([['Số dư theo sổ mẫu',money(known()?accounts.reduce((a,x)=>a+recordedBalance(x),0n):null)],['Số dư thực tế',money(null)]],'','Đến 27/11/2026 · chưa đối chiếu');if(tab==='loans')return summary([['Dư gốc theo sổ mẫu',money(known()?loanPrincipal():null)],['Lãi đã trả',money(known()?sum(payments.filter(p=>p.cat==='Lãi vay')):null)]],'','Đến 27/11/2026 · lịch sử chưa đầy đủ');return summary([['Tài sản trong mẫu',known()?'2':'—'],['Tổng định giá hiện tại','—']],'','Đến 27/11/2026 · chưa có định giá đầy đủ')}\nfunction paymentDetail(x){const r=records.find(r=>r.id===x.link);return `\u003cdiv class=\"detail\">\u003ch2>${esc(x.title)}\u003c/h2>\u003cdiv class=\"big\">${x.kind==='in'?'+':x.kind==='out'?'−':''}${money(x.amount)}\u003c/div>\u003cp class=\"qualityline\">Đã xác nhận trong mẫu · ${x.cat}\u003c/p>${kv('Ngày thu / chi',x.date)}${kv(x.kind==='transfer'?'Từ tài khoản':'Tài khoản',accountName(x.account))}${x.to?kv('Đến tài khoản',accountName(x.to)):''}${kv('Nguồn',x.source)}\u003cbutton class=\"recordlink\" data-act=\"source\" data-id=\"${x.id}\">Xem nguồn ›\u003c/button>${r?`\u003ch3 class=\"section\">Giao dịch gốc\u003c/h3>${kv('Nội dung',esc(r.name))}${kv(r.kind==='sale'?'Giá trị bán':'Chi phí',money(r.amount))}${kv(r.kind==='sale'?'Đã thu':'Đã chi',money(paid(r)))}${kv(r.kind==='sale'?'Còn phải thu':'Còn phải trả',money(outstanding(r)))}\u003cbutton class=\"recordlink\" data-act=\"related\" data-id=\"${r.id}\">Lịch sử thanh toán ›\u003c/button>`:''}${x.kind==='transfer'?'\u003cp class=\"notice\">Chuyển nội bộ · không tăng tổng thu hoặc chi gia đình.\u003c/p>':x.loan?`\u003ch3 class=\"section\">Khoản vay\u003c/h3>${kv('Khoản gốc theo mẫu',money(loanPrincipal()))}\u003cp class=\"notice\">${x.cat==='Lãi vay'?'Khoản lãi tách riêng với gốc.':'Vay / trả gốc không phải doanh thu hoặc chi phí.'}\u003c/p>`:x.asset?'\u003cp class=\"notice\">Tiền đã chi mua tài sản; chưa xác định vốn hóa hoặc khấu hao.\u003c/p>':''}\u003c/div>`}\nfunction debtDetail(r){const v=outstanding(r);return `\u003cdiv class=\"detail\">\u003ch2>${esc(r.name)}\u003c/h2>\u003cdiv class=\"big\">${money(v)}\u003c/div>\u003cp class=\"qualityline ${v===null?'warn':''}\">${v===null?'Chưa rõ thanh toán':r.kind==='sale'?'Còn phải thu':'Còn phải trả'}\u003c/p>${kv('Ngày nghiệp vụ',r.date+'/2026')}${kv('Năm sản xuất','2026')}${kv('Giá trị theo nguồn',money(r.amount))}${kv('Xác nhận',r.quality)}${kv(r.kind==='sale'?'Đã thu':'Đã chi',money(paid(r)))}${kv('Nguồn',r.source)}\u003cbutton class=\"recordlink\" data-act=\"source\" data-
